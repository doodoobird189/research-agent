planning_task:
  description: >
    Analyse the following research question:

    {topic}

    Break the question into 3 to 5 distinct, non-overlapping research
    objectives. Each objective should be specific enough that a researcher
    can search for it directly.

    Make sure every part of the question is covered by at least one
    objective. If the question asks several things (for example "who leads"
    and "how realistic are their timelines"), each part needs an objective.

  expected_output: >
    A JSON object containing a list of research objectives under the key
    "research_topics".

research_task:
  description: >
    Research one objective that is part of a larger research question.

    Overall research question: {topic}

    Your objective: {objective}

    Focus only on your objective. Other researchers are covering the other
    parts of the question.

    - Search for academic papers, industry reports, official websites and
      reputable publications.
    - Collect at least 3 findings, from at least 2 different websites.
    - Record each distinct fact, statistic or statement as a separate finding.
    - For every finding, record the source URL, and the source title and
      publication date where available.
    - Only use URLs that the search or scraping tools actually returned.
      Never write, guess or reconstruct a URL yourself.
    - Where possible, include a verbatim quote from the source that supports
      the finding.
    - Put full context, nuance and caveats in the finding's details rather
      than leaving them out.
    - Preserve the distinction between facts and opinions.

    Leave the id and objective fields empty; they are filled in
    automatically.

    Put anything relevant that does not fit a finding in the notes.

    Collect evidence only. Do not verify claims, write a report or draw
    broad conclusions.

  expected_output: >
    Structured research findings for your objective, each with a specific
    claim, supporting details and a real source URL.

fact_checking_task:
  description: >
    Independently verify every finding collected by the researcher.

    Research topic: {topic}

    For each finding:
    - Refer to it by its finding ID only. Do not restate or rewrite the
      finding itself.
    - Cross-reference the claim against independent sources, not just the
      original source URL.
    - Assign exactly one verdict:
        supported - confirmed by independent sources.
        partially_supported - broadly right, but a detail is wrong.
        contradicted - other reliable sources disagree.
        outdated - was true, but has been superseded.
        unverifiable - could not be confirmed or refuted.
    - Give a confidence score between 0 and 1 and explain your reasoning.
    - List the independent source URLs you used as evidence.
    - If the verdict is partially_supported, contradicted or outdated,
      provide a corrected statement where possible.

    Findings to check:

    {findings}

    Also identify findings that conflict with each other, listing the IDs
    involved and describing the conflict. Only report a contradiction when
    two findings make incompatible claims about the same thing (for example,
    two different figures for the same metric). Findings about different
    subjects are not contradictions.

    Check every finding. Do not skip any finding ID.

  expected_output: >
    A structured fact-check report with one check per finding ID, a list of
    contradictions between findings, and any additional notes about source
    reliability.

report_writing_task:
  description: >
    Write a comprehensive Markdown research report on {topic}.

    Match each fact-check verdict to its finding using the finding ID.

    Research findings:

    {findings}

    Fact-check report:

    {fact_check}

    Apply these rules:
    - Use supported findings as the basis of the report.
    - For partially_supported or outdated findings, state the corrected
      statement from the fact-check report instead of the original claim.
      Never repeat the original figures or wording of a corrected claim.
    - Exclude contradicted findings unless a correction is available.
    - Include unverifiable findings only if they are important, and clearly
      mark them as unverified.
    - Where findings conflict, present both sides and note the conflict.

    Citation rules:
    - Every factual statement must end with its finding ID and a source
      link, in the form (F3, [Source Title](source_url)).
    - Use the finding's own source_title and source_url. Never rename a
      source or attribute it to a different organisation.
    - Do not write any factual statement that is not backed by a finding,
      including general statements about opportunities or trends.
    - If an objective has no usable findings, say "No verified findings
      were found for this objective." instead of filling the gap.

    Include:
    - Executive summary.
    - Introduction and research scope.
    - Main findings, organised by research objective.
    - Key themes and comparisons across findings.
    - Open questions and limitations of the research.
    - Conclusion.
    - References listing every cited source URL.

    Do not introduce claims or background knowledge that are not in the
    findings.

    Output format: your answer is saved directly as a .md file. Start
    immediately with the report's "# " title and output raw Markdown only.
    Do not wrap the report in a code block (no ``` or ```markdown fences)
    and do not add any text before or after the report.

  expected_output: >
    A comprehensive, professionally structured Markdown research report
    with inline citations and a references section with source URLs,
    starting with a "# " title line and not wrapped in a code block.
